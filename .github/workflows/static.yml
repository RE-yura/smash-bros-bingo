# PR と main への push でチェック・テスト・ビルドを行い、main のときだけ GitHub Pages にデプロイする
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # Actions タブから手動でも実行できるようにする
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチ・PR で新しい実行が始まったら、PR の古い実行は止める（main の実行は止めない）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Vite+
        # タグ v1 は更新が止まっているので、正確なバージョンで固定する
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Check
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp build
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  e2e:
    # ブラウザ確認は PR のときだけ流す（main にはマージ前に確かめたものが入る）。
    # 外部サイト（smashbros.com）の画像を使うので、デプロイの条件にはしない
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Vite+
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Install Japanese fonts
        # 名前の折り返しを実際の表示に近い条件で確かめるため
        run: sudo apt-get update -qq && sudo apt-get install -y -qq fonts-noto-cjk
      - name: Browser checks
        run: npm run e2e
        env:
          E2E_OUT_DIR: ${{ runner.temp }}/e2e
      - name: Upload screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-screenshots
          path: ${{ runner.temp }}/e2e

  deploy:
    # デプロイは main のときだけ
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # GITHUB_TOKEN に Pages へのデプロイを許可する
    permissions:
      pages: write
      id-token: write
    # 同時に走るデプロイは1つだけにし、実行中のデプロイは止めない
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
