# PR と main への push でチェック・テスト・ビルドを行い、main のときだけ GitHub Pages にデプロイする
name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  # Actions タブから手動でも実行できるようにする
  workflow_dispatch:

permissions:
  contents: read

# 同じブランチ・PR で新しい実行が始まったら、PR の古い実行は止める（main の実行は止めない）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Vite+
        # タグ v1 は更新が止まっているので、正確なバージョンで固定する
        uses: voidzero-dev/setup-vp@v1.21.1
        with:
          node-version: "24"
          cache: true
      - name: Check
        run: vp check
      - name: Test
        run: vp test
      - name: Build
        run: vp build
      - name: Upload artifact
        if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./dist

  deploy:
    # デプロイは main のときだけ
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    # GITHUB_TOKEN に Pages へのデプロイを許可する
    permissions:
      pages: write
      id-token: write
    # 同時に走るデプロイは1つだけにし、実行中のデプロイは止めない
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
